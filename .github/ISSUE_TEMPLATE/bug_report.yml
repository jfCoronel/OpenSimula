name: Bug report
description: Something does not work or gives wrong results
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: A minimal project (dict or JSON) and the code that runs it. Attach the weather or data files if they are not the ones in `mets/`.
      render: python
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error message or output
      render: text
  - type: input
    id: version
    attributes:
      label: OpenSimula version
      description: "`python -c \"import opensimula; print(opensimula.VERSION)\"`"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version, OS and where you run it (Jupyter, VS Code, marimo, script)
