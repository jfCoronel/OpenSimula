<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 470" width="1010" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/>
    </marker>
    <style>
      .title { font-size: 15px; font-weight: bold; fill: #0b0b0b; }
      .name { font-size: 14px; font-weight: bold; fill: #0b0b0b; }
      .uses { font-size: 11.5px; fill: #52514e; }
      .param { font-size: 11.5px; fill: #52514e; font-style: italic; }
      .note { font-size: 11.5px; fill: #52514e; }
      .zone { fill: #fde9e1; stroke: #eb6834; stroke-width: 1.5; }
      .system { fill: #ebe8fb; stroke: #6250d6; stroke-width: 1.5; }
      .optional { fill: #ebe8fb; stroke: #6250d6; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .link { stroke: #52514e; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .link-alt { stroke: #52514e; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1010" height="470" fill="#ffffff"/>

  <!-- column titles -->
  <text x="95" y="28" text-anchor="middle" class="title">Zones</text>
  <text x="345" y="28" text-anchor="middle" class="title">Air systems</text>
  <text x="775" y="28" text-anchor="middle" class="title">Water side</text>
  <line x1="20" y1="40" x2="990" y2="40" stroke="#e6e5e1" stroke-width="1"/>

  <!-- zones: a system serves one (or several, MZW) of either kind -->
  <rect x="10" y="118" width="172" height="182" rx="8" fill="none" stroke="#eb6834" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="96" y="136" text-anchor="middle" class="note">Space or Load_space</text>
  <rect x="20" y="150" width="150" height="46" rx="6" class="zone"/>
  <text x="95" y="170" text-anchor="middle" class="name">Space</text>
  <text x="95" y="187" text-anchor="middle" class="uses">of a building</text>
  <rect x="20" y="230" width="150" height="46" rx="6" class="zone"/>
  <text x="95" y="250" text-anchor="middle" class="name">Load_space</text>
  <text x="95" y="267" text-anchor="middle" class="uses">from load records</text>

  <!-- air systems -->
  <rect x="250" y="60" width="190" height="46" rx="6" class="system"/>
  <text x="345" y="80" text-anchor="middle" class="name">HVAC_perfect_system</text>
  <text x="345" y="97" text-anchor="middle" class="uses">ideal loads</text>
  <rect x="250" y="135" width="190" height="46" rx="6" class="system"/>
  <text x="345" y="155" text-anchor="middle" class="name">HVAC_DX_system</text>
  <text x="345" y="172" text-anchor="middle" class="uses">uses DX_unit</text>
  <rect x="250" y="250" width="190" height="46" rx="6" class="system"/>
  <text x="345" y="270" text-anchor="middle" class="name">HVAC_SZW_system</text>
  <text x="345" y="287" text-anchor="middle" class="uses">uses Water_coil, Fan</text>
  <rect x="250" y="325" width="190" height="46" rx="6" class="system"/>
  <text x="345" y="345" text-anchor="middle" class="name">HVAC_MZW_system</text>
  <text x="345" y="362" text-anchor="middle" class="uses">uses Water_coil, Fan</text>

  <!-- air systems to zones -->
  <path d="M 250 83 C 215 83, 215 160, 184 165" class="link"/>
  <path d="M 250 158 C 220 158, 210 185, 184 188" class="link"/>
  <path d="M 250 273 C 220 273, 210 245, 184 240" class="link"/>
  <path d="M 250 348 C 210 348, 215 270, 184 265" class="link"/>
  <text x="218" y="118" text-anchor="middle" class="param">spaces</text>
  <text x="218" y="322" text-anchor="middle" class="param">space(s)</text>

  <!-- water side -->
  <rect x="560" y="165" width="200" height="56" rx="6" class="optional"/>
  <text x="660" y="186" text-anchor="middle" class="name">HVAC_water_circuit</text>
  <text x="660" y="203" text-anchor="middle" class="uses">pumps (Pump), mixing valve</text>
  <text x="660" y="216" text-anchor="middle" class="uses">optional, one or several</text>

  <rect x="560" y="300" width="200" height="56" rx="6" class="system"/>
  <text x="660" y="321" text-anchor="middle" class="name">HVAC_water_system</text>
  <text x="660" y="338" text-anchor="middle" class="uses">the plant; secondary pumps</text>
  <text x="660" y="351" text-anchor="middle" class="uses">(Pump, optional): header</text>

  <!-- generators: stacked to show several -->
  <rect x="846" y="292" width="152" height="70" rx="6" class="system" opacity="0.55"/>
  <rect x="838" y="300" width="152" height="70" rx="6" class="system"/>
  <text x="914" y="321" text-anchor="middle" class="name">HVAC_water_</text>
  <text x="914" y="337" text-anchor="middle" class="name">generator</text>
  <text x="914" y="353" text-anchor="middle" class="uses">Chiller_heat_pump</text>
  <text x="914" y="365" text-anchor="middle" class="uses">or Boiler, and a Pump</text>

  <!-- coils to circuit (or directly to the plant) -->
  <path d="M 440 270 C 500 270, 500 200, 558 196" class="link"/>
  <path d="M 440 345 C 505 345, 495 215, 558 206" class="link"/>
  <text x="505" y="232" text-anchor="end" class="param">heating_water_system</text>
  <text x="505" y="246" text-anchor="end" class="param">cooling_water_system</text>
  <path d="M 440 280 C 500 285, 510 318, 558 322" class="link-alt"/>
  <path d="M 440 355 C 500 360, 515 340, 558 336" class="link-alt"/>
  <text x="498" y="398" text-anchor="middle" class="note">or directly to the plant</text>
  <line x1="498" y1="386" x2="512" y2="352" stroke="#52514e" stroke-width="0.8"/>

  <!-- circuit to plant, plant to generators -->
  <path d="M 660 221 L 660 298" class="link"/>
  <text x="668" y="264" class="param">water_system</text>
  <path d="M 760 328 L 836 328" class="link"/>
  <text x="798" y="321" text-anchor="middle" class="param">generators</text>

  <!-- legend -->
  <rect x="20" y="425" width="18" height="12" rx="2" class="zone"/>
  <text x="44" y="435" class="note">zone</text>
  <rect x="90" y="425" width="18" height="12" rx="2" class="system"/>
  <text x="114" y="435" class="note">system (simulated)</text>
  <rect x="240" y="425" width="18" height="12" rx="2" class="optional"/>
  <text x="264" y="435" class="note">optional</text>
  <line x1="340" y1="431" x2="372" y2="431" class="link"/>
  <text x="380" y="435" class="note">refers to, with the parameter in italics</text>
  <text x="20" y="458" class="note">Equipment components (DX_unit, Water_coil, Fan, Pump, Chiller_heat_pump, Boiler) only hold the manufacturer's data: they are named in grey under the systems that use them.</text>
</svg>
